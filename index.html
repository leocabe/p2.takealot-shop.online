<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VSL Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
    color:#fff;
}

.top-bar{
    background:#ff0000;
    color:#fff;
    text-align:center;
    font-weight:800;
    font-size:16px;
    padding:12px 10px;
    letter-spacing:1px;
}

.headline{
    text-align:center;
    font-size:28px;
    font-weight:900;
    line-height:1.2;
    padding:18px 20px 20px;
    text-transform:uppercase;
    max-width:1200px;
    margin:auto;
}

.headline span{
    color:#ff2b2b;
}

.video-wrapper{
    display:flex;
    justify-content:center;
    padding:10px 15px 40px;
}

.video-box{
    width:100%;
    max-width:430px;
}

.video-box iframe,
.video-box video,
.video-box vturb-smartplayer{
    width:100% !important;
    display:block;
    margin:auto;
}

@media(max-width:768px){

    .headline{
        font-size:22px;
    }

}
</style>
</head>

<body>

<div class="top-bar">
    LAST CHANCE - <span id="timer">04:36</span>
</div>

<h1 class="headline">
    THE <span>AFRICAN ENERGY BOOSTER</span> THAT PUTS AN END TO YOUR HUMILIATION HAS BEEN REVEALED
</h1>

<div class="video-wrapper">
    <div class="video-box">

        <vturb-smartplayer
            id="vid-6a1b51e9b1d3987c28eb6a30"
            style="display:block;margin:0 auto;width:100%;max-width:430px;">
        </vturb-smartplayer>

    </div>
</div>

<script type="text/javascript">
var s=document.createElement("script");
s.src="https://scripts.converteai.net/c8fe99ac-9f30-4203-b2ef-b47ac101569f/players/6a1b51e9b1d3987c28eb6a30/v4/player.js";
s.async=true;
document.head.appendChild(s);
</script>

<script>
let minutes = 4;
let seconds = 36;

const timer = document.getElementById("timer");

setInterval(() => {

    if(seconds === 0){
        if(minutes === 0) return;
        minutes--;
        seconds = 59;
    }else{
        seconds--;
    }

    timer.textContent =
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0");

},1000);
</script>

</body>
</html>
